<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background-color: #f4f4f4;
      }
      h1 {
        text-align: center;
      }
      .filter-buttons {
        text-align: center;
        margin-bottom: 20px;
      }
      button {
        padding: 8px 15px;
        margin: 5px;
        border: none;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;

        display: grid;

        background: white;

      <!DOCTYPE
        html
        > <html
        lang="en"
        > <head
        > <meta
        charset="UTF-8"
        > <title
        > Simple
        E-Commerce</title
        > <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        > <style
        > body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
      }

      h1 {
        text-align: center;
      }

      .filter-buttons {
        text-align: center;
        margin-bottom: 20px;
      }

      button {
        padding: 8px 15px;
        margin: 5px;
        border: none;
        background-color: #007bff;
        color: white;
        cursor: pointer;
        border-radius: 5px;
      }

      button:hover {
        background-color: #0056b3;
      }

      .product-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
      }

      .price {
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>My Simple E-Commerce</h1>

    <div class="filter-buttons">
      <button onclick="filterProduct('all')">All</button>
      <button onclick="filterProduct('electronics')">Electronics</button>
      <button onclick="filterProduct('fashion')">Fashion</button>
      <button onclick="filterProduct('food')">Food</button>
    </div>

    <div class="product-container" id="product-list"></div>

    <script>
      // ARRAY PRODUK
      const products = [
        {
          name: "Laptop Asus",
          price: 8000000,
          description: "Powerful laptop for coding and gaming.",
          image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8",
          category: "electronics",
        },
        {
          name: "Wireless Headphone",
          price: 500000,
          description: "High quality sound with noise cancellation.",
          image: "https://images.unsplash.com/photo-1518443895914-1a6a73b4b5c9",
          category: "electronics",
        },
        {
          name: "Men T-Shirt",
          price: 120000,
          description: "Comfortable cotton t-shirt.",
          image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
          category: "fashion",
        },
        {
          name: "Sneakers",
          price: 450000,
          description: "Stylish and comfortable sneakers.",
          image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff",
          category: "fashion",
        },
        {
          name: "Burger",
          price: 30000,
          description: "Delicious beef burger.",
          image: "https://images.unsplash.com/photo-1550547660-d9450f859349",
          category: "food",
        },
      ];

      const productList = document.getElementById("product-list");

      // FUNCTION UNTUK MENAMPILKAN PRODUK
      function displayProducts(productArray) {
        productList.innerHTML = "";

        productArray.forEach((product) => {
          productList.innerHTML += `
                    <div class="card">
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <p>${product.description}</p>
                        <p class="price">Rp ${product.price.toLocaleString()}</p>
                    </div>
                `;
        });
      }

      // FUNCTION FILTER
      function filterProduct(category) {
        if (category === "all") {
          displayProducts(products);
        } else {
          const filtered = products.filter(
            (product) => product.category === category,
          );
          displayProducts(filtered);
        }
      }

      // TAMPILKAN SEMUA PRODUK SAAT PERTAMA LOAD
      displayProducts(products);
    </script>
  </body>
</html>
